name: distributor
description: "حساب الموزع - توزيع يومي على البقالات، تحصيل ليلي، وحساب التاجر"
publish_to: 'none'
version: 2.3.1+231

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  provider: 6.1.5+1
  hive: 2.2.3
  hive_flutter: 1.1.0
  shared_preferences: 2.5.3
  uuid: 4.5.1
  url_launcher: 6.3.1
  path_provider: 2.1.5
  share_plus: 10.1.4
  file_picker: 8.1.6
  archive: 3.6.1
  crypto: 3.0.6
  http: 1.6.0
  mobile_scanner: 7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
